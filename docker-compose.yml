services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: ${SCHOOL_DB_PASSWORD:-school_local_only_2026}
    volumes:
      - school_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend/SchoolAdmission.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=school_admission;Username=school_user;Password=${SCHOOL_DB_PASSWORD:-school_local_only_2026}"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/backend}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  tests:
    profiles: ["test"]
    build:
      context: ./tests/SchoolAdmission.Tests
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      - api

volumes:
  school_postgres_data:
