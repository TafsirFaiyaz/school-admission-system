
services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: ${SCHOOL_DB_PASSWORD:-school_local_only_2026}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - school_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  school_postgres_data:
